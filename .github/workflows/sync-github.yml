name: Sync GitHub profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main, master]
    paths:
      - scripts/sync-github.mjs
      - js/github-config.mjs
      - .github/workflows/sync-github.yml

permissions:
  contents: write

concurrency:
  group: github-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch public GitHub data
        run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub profile data"
            git push
          fi
